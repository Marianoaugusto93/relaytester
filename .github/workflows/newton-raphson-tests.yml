name: Newton-Raphson Parity Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  parity-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --prefer-offline

    - name: Run parity harness tests
      run: npm test -- tests/harness/powerflow-parity.test.js --reporter=verbose
      timeout-minutes: 5

    - name: Verify test results
      if: success()
      run: |
        echo "✅ Parity tests passed - solver output fidelity verified"

    - name: Report results
      if: always()
      run: |
        echo "## Newton-Raphson Parity Test Report" >> $GITHUB_STEP_SUMMARY
        echo "- Node: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Parity Gate: solver drift tolerance ≤ 1e-9 p.u." >> $GITHUB_STEP_SUMMARY
