  #diagram .bus-hit { cursor: move; }
  #diagram .bus-hit.cursor-add { cursor: crosshair; }
  #diagram .bus-hit.cursor-delete { cursor: not-allowed; }
  #diagram.cursor-add { cursor: crosshair; }
  #diagram.cursor-delete { cursor: not-allowed; }
  /* In delete mode: every hit element should show the not-allowed cursor as
     a visual cue that the click will remove that element. The cursor-delete
     class is on #diagram itself; cascade to all hit areas with !important so
     it overrides the default move/pointer cursors on bus-hit and branch-hit. */
  #diagram.cursor-delete .bus-hit,
  #diagram.cursor-delete .branch-hit,
  #diagram.cursor-delete .elem-hit { cursor: not-allowed !important; }
  /* Visible hover cue in delete mode: any hovered hit element gets a red glow
     so the user can see exactly what they're about to delete before clicking.
     The hit elements are transparent fills, so we paint a red stroke on the
     overlay shape itself. */
  #diagram.cursor-delete .bus-hit:hover { fill: rgba(255, 49, 0, 0.12) !important; stroke: #ff3100; stroke-width: 2; }
  #diagram.cursor-delete .branch-hit:hover { stroke: rgba(255, 49, 0, 0.5) !important; }
  #diagram.cursor-delete .elem-hit:hover { fill: rgba(255, 49, 0, 0.18) !important; stroke: #ff3100; stroke-width: 2; }
  /* Labels in delete mode: red text on hover so the user knows clicking the
     label will delete the underlying element. */
  #diagram.cursor-delete .draggable-label { cursor: not-allowed !important; }
  #diagram.cursor-delete .draggable-label:hover text {
    fill: #ff3100 !important;
    font-weight: 700;
    text-decoration: line-through !important;
    text-decoration-color: #ff3100 !important;
