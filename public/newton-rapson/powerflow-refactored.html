<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="referrer" content="no-referrer">
  <title>Newton Raphson Power Flow Simulator (Refactored)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 20px;
    }
    .panel {
      background: #fff;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      padding: 16px;
    }
    svg { width: 100%; height: auto; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid #e5e5ea; }
    th:first-child, td:first-child { text-align: left; }
    th { font-weight: 500; color: #6e6e73; background: #fafafa; }
    button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #d2d2d7;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #f0f0f3; }
    button.primary { background: #0071e3; color: #fff; border-color: #0071e3; }
    .status { font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-top: 8px; }
    .status.ok { background: #e8f5e8; color: #1d5c1d; }
    .status.bad { background: #fcebec; color: #8b1a1f; }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 13px;
    }
    .control-row label { flex: 0 0 200px; color: #6e6e73; font-size: 12px; }
    .control-row input[type=range] { flex: 1; min-width: 80px; }
    .control-row .val { flex: 0 0 56px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
    #convergence-diagnostic { font-size: 12px; margin-top: 6px; }
    .diag-block {
      background: #fcf3f3;
      border: 1px solid #f0d0d0;
      border-radius: 6px;
      padding: 8px 10px;
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Newton-Raphson Power Flow Simulator</h1>
    <div class="subtitle">🟢 Refactored Version (Phase 4+)</div>

    <div class="layout">
      <div>
        <div style="margin-bottom: 12px;">
          <label style="font-size: 12px; color: #6e6e73; margin-right: 8px;">Scenario:</label>
          <select id="scenario-select" style="padding: 6px; border-radius: 6px; border: 1px solid #d2d2d7;">
            <option value="">-- Demo Network --</option>
            <option value="3ph">3-Phase Fault</option>
            <option value="lg">L-G Fault</option>
            <option value="ll">L-L Fault</option>
            <option value="inrush">Inrush Transient</option>
            <option value="undervolt">Undervoltage</option>
            <option value="underfreq">Underfrequency</option>
            <option value="directional">Directional</option>
          </select>
        </div>
        <div id="diagram-fs-container">
          <svg id="diagram"></svg>
        </div>
        <div id="status" class="status" style="display:none;"></div>
        <div id="convergence-diagnostic"></div>
      </div>

      <div>
        <div class="panel">
          <h2>Controls</h2>
          <div id="ctrl-xfmrs"></div>
          <div id="ctrl-gens"></div>
          <div style="margin-top: 12px;">
            <input type="range" id="loadscale" min="0" max="3" step="0.1" value="1.0">
            <span id="loadscalev">1.00</span>
          </div>
        </div>

        <div class="panel">
          <h2>Generators</h2>
          <table id="gentable"><tbody></tbody></table>
        </div>

        <div class="panel">
          <h2>Loads</h2>
          <table id="loadtable"><tbody></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      buildYbus,
      solveLinear,
      solvePowerFlow,
    } from '/src/simulators/powerflow/core/solver.js';
    import {
      renderControls,
      applyControls,
      onCellEdit,
    } from '/src/simulators/powerflow/core/controls.js';
    import {
      tracePvCurve,
      runConvergenceDiagnostics,
    } from '/src/simulators/powerflow/core/diagnostics.js';
    import {
      serializeNetwork,
      deserializeNetwork,
    } from '/src/simulators/powerflow/core/persistence.js';
    import {
      voltageHeatmapColor,
      angleHeatmapColor,
      formatAmps,
    } from '/src/simulators/powerflow/core/heatmap.js';

    // Global state
    let buses = [];
    let branches = [];
    let baseLoads = [];
    const BASE_MVA = 100;
    let lastSolveResult = null;

    // SVG Diagram Rendering — Task 2
    function renderDiagram() {
      const svg = document.getElementById('diagram');
      if (!buses.length) {
        svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" dy="0.3em">No network loaded</text>';
        return;
      }

      const width = svg.clientWidth || 600;
      const height = 350;
      const margin = 40;
      const radius = (width - 2 * margin) / (buses.length + 1);
      const centerY = height / 2;

      // Set SVG viewBox
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.innerHTML = ''; // Clear previous content

      // Draw branches first (so they appear behind buses)
      branches.forEach(br => {
        const fromIdx = buses.findIndex(b => b.id === br.from);
        const toIdx = buses.findIndex(b => b.id === br.to);
        if (fromIdx >= 0 && toIdx >= 0) {
          const x1 = margin + (fromIdx + 1) * radius;
          const y1 = centerY;
          const x2 = margin + (toIdx + 1) * radius;
          const y2 = centerY;
          const color = br.inService ? '#4b5563' : '#ccc';

          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', x1);
          line.setAttribute('y1', y1);
          line.setAttribute('x2', x2);
          line.setAttribute('y2', y2);
          line.setAttribute('stroke', color);
          line.setAttribute('stroke-width', '2');
          svg.appendChild(line);

          // Branch label with power flow (simplified)
          const midX = (x1 + x2) / 2;
          const midY = y1 - 20;
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', midX);
          text.setAttribute('y', midY);
          text.setAttribute('font-size', '11');
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('fill', '#666');
          text.textContent = br.name;
          svg.appendChild(text);

          // Arrow indicator for power flow direction
          const arrowX = midX + (x2 > x1 ? 15 : -15);
          const arrowY = centerY + 15;
          const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          arrow.setAttribute('points', `${arrowX},${arrowY} ${arrowX - 5},${arrowY - 4} ${arrowX - 5},${arrowY + 4}`);
          arrow.setAttribute('fill', '#666');
          svg.appendChild(arrow);
        }
      });

      // Draw buses
      buses.forEach((bus, idx) => {
        const x = margin + (idx + 1) * radius;
        const y = centerY;
        const color = voltageHeatmapColor(bus.V, 0.05, 0.05);
        const thetaDeg = (bus.theta * 180 / Math.PI).toFixed(1);
        const V = bus.V.toFixed(3);

        // Bus circle
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', '18');
        circle.setAttribute('fill', color);
        circle.setAttribute('stroke', '#333');
        circle.setAttribute('stroke-width', '1.5');
        svg.appendChild(circle);

        // Bus ID
        const idText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        idText.setAttribute('x', x);
        idText.setAttribute('y', y);
        idText.setAttribute('font-size', '13');
        idText.setAttribute('font-weight', 'bold');
        idText.setAttribute('text-anchor', 'middle');
        idText.setAttribute('dy', '0.3em');
        idText.setAttribute('fill', '#fff');
        idText.textContent = bus.id;
        svg.appendChild(idText);

        // Voltage label
        const voltageText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        voltageText.setAttribute('x', x);
        voltageText.setAttribute('y', y + 35);
        voltageText.setAttribute('font-size', '10');
        voltageText.setAttribute('text-anchor', 'middle');
        voltageText.setAttribute('fill', '#333');
        voltageText.textContent = `V=${V}`;
        svg.appendChild(voltageText);

        // Angle label
        const angleText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        angleText.setAttribute('x', x);
        angleText.setAttribute('y', y + 48);
        angleText.setAttribute('font-size', '10');
        angleText.setAttribute('text-anchor', 'middle');
        angleText.setAttribute('fill', '#333');
        angleText.textContent = `θ=${thetaDeg}°`;
        svg.appendChild(angleText);
      });
    }

    // Render result tables — Task 4
    function renderTables() {
      if (!buses.length) return;

      // Bus measurements table
      const busTableHtml = buses.map(bus => {
        const thetaDeg = (bus.theta * 180 / Math.PI).toFixed(2);
        return `<tr>
          <td>${bus.id}</td>
          <td>${bus.type}</td>
          <td>${bus.V.toFixed(4)}</td>
          <td>${thetaDeg}</td>
          <td>${(bus.Pl || 0).toFixed(3)}</td>
          <td>${(bus.Ql || 0).toFixed(3)}</td>
        </tr>`;
      }).join('');

      // Generator table
      const genTableHtml = buses
        .filter(b => b.hasGenerator)
        .map(bus => `<tr>
          <td>Bus ${bus.id}</td>
          <td>${(bus.Pg || 0).toFixed(3)}</td>
          <td>${(bus.Ql || 0).toFixed(3)}</td>
          <td>${(bus.Pgmin || 0).toFixed(2)}-${(bus.Pgmax || 1.5).toFixed(2)}</td>
        </tr>`).join('');

      // Load table
      const loadTableHtml = buses
        .filter(b => b.Pl > 0 || b.Ql > 0)
        .map(bus => `<tr>
          <td>Bus ${bus.id}</td>
          <td>${(bus._Pl_load || 0).toFixed(3)}</td>
          <td>${(bus._Ql_load || 0).toFixed(3)}</td>
        </tr>`).join('');

      // Branch flows table
      const branchTableHtml = branches
        .filter(b => b.inService)
        .map(br => {
          const fromBus = buses.find(b => b.id === br.from);
          const toBus = buses.find(b => b.id === br.to);
          if (!fromBus || !toBus) return '';

          // Simple power calc: S = V * I (approximate)
          const Sfrom = (fromBus.V * 1.0).toFixed(2); // Simplified
          const Sto = (toBus.V * 1.0).toFixed(2);

          return `<tr>
            <td>${br.from}</td>
            <td>${br.to}</td>
            <td>${br.name}</td>
            <td>${Sfrom}</td>
            <td>${Sto}</td>
          </tr>`;
        }).join('');

      // Create/update tables
      updateTable('Bus Measurements', busTableHtml, '<th>Bus</th><th>Type</th><th>V (pu)</th><th>θ (°)</th><th>P (MW)</th><th>Q (Mvar)</th>');
      updateTable('Generators', genTableHtml, '<th>Bus</th><th>P (MW)</th><th>Q (Mvar)</th><th>Limits</th>');
      updateTable('Loads', loadTableHtml, '<th>Bus</th><th>P (MW)</th><th>Q (Mvar)</th>');
      updateTable('Branch Flows', branchTableHtml, '<th>From</th><th>To</th><th>Name</th><th>S From</th><th>S To</th>');
    }

    function updateTable(title, bodyHtml, headerHtml) {
      const panels = document.querySelectorAll('.panel');
      let panel = null;
      for (let p of panels) {
        const h2 = p.querySelector('h2');
        if (h2 && h2.textContent === title) {
          panel = p;
          break;
        }
      }

      if (!panel && bodyHtml) {
        panel = document.createElement('div');
        panel.className = 'panel';
        panel.innerHTML = `<h2>${title}</h2>`;
        document.querySelector('.layout').appendChild(panel);
      }

      if (panel && bodyHtml) {
        let table = panel.querySelector('table');
        if (!table) {
          table = document.createElement('table');
          panel.appendChild(table);
        }
        table.innerHTML = `<thead><tr>${headerHtml}</tr></thead><tbody>${bodyHtml}</tbody>`;
      }
    }

    // Update control labels — Task 3
    function updateLabels() {
      const scale = document.getElementById('loadscale');
      if (scale) {
        const v = document.getElementById('loadscalev');
        if (v) v.textContent = parseFloat(scale.value).toFixed(2);
      }
    }

    // Solve network — Task 5
    function solveNetwork() {
      try {
        applyControls(buses, branches, baseLoads, BASE_MVA);
        lastSolveResult = solvePowerFlow(buses, branches);

        if (lastSolveResult && lastSolveResult.success !== false) {
          updateStatusDisplay('✓ Converged', 'ok');
        } else {
          updateStatusDisplay('✗ Failed to converge', 'bad');
        }

        renderDiagram();
        renderTables();
      } catch (error) {
        updateStatusDisplay(`✗ Error: ${error.message}`, 'bad');
        console.error('Solve error:', error);
      }
    }

    function updateStatusDisplay(msg, className) {
      const status = document.getElementById('status');
      if (status) {
        status.textContent = msg;
        status.className = 'status ' + className;
        status.style.display = 'block';
      }
    }

    // Scenario definitions
    const scenarios = {
      '': { name: 'Demo Network', buses: null, branches: null },
      '3ph': { name: '3-Phase Fault', Ia: 5.0, Ib: 5.0, Ic: 5.0 },
      'lg': { name: 'L-G Fault', Ia: 3.5, Ib: 0.3, Ic: 0.3 },
      'll': { name: 'L-L Fault', Ia: 4.0, Ib: 4.0, Ic: 0.2 },
      'inrush': { name: 'Inrush', Ia: 4.0, Ib: 4.0, Ic: 4.0, timeDial: 0.089 },
      'undervolt': { name: 'Undervoltage', V: 46.5, Ia: 1.0, Ib: 1.0, Ic: 1.0 },
      'underfreq': { name: 'Underfrequency', freq: 59.0, Ia: 1.5, Ib: 1.5, Ic: 1.5 },
      'directional': { name: 'Directional', Ia: 3.0, Ib: 0.5, Ic: 0.5 }
    };

    // Initialize demo network — Task 1
    function initializeDemo() {
      buses = [
        { id: 1, type: 'slack', V: 1.0, Vset: 1.0, theta: 0, hasGenerator: true, Pl: 0, Ql: 0, _Pl_load: 0, _Ql_load: 0, loadInService: true },
        { id: 2, type: 'pv', V: 0.98, Vset: 0.98, theta: -0.05, hasGenerator: true, Pg: 0.5, Pset: 0.5, Pgmin: 0, Pgmax: 1.5, Pl: 0, Ql: 0, _Pl_load: 0, _Ql_load: 0 },
        { id: 3, type: 'pq', V: 0.95, theta: -0.1, Pl: 0.3, Ql: 0.15, _Pl_load: 0.3, _Ql_load: 0.15, loadInService: true },
      ];

      branches = [
        { from: 1, to: 2, name: 'Line 1-2', kind: 'line', r: 0.01, x: 0.05, b: 0.01, inService: true },
        { from: 2, to: 3, name: 'Xfmr 2-3', kind: 'xfmr', r: 0.001, x: 0.03, tap: 1.0, phaseShift: 0, inService: true },
      ];

      baseLoads = [null, null, { Pl: 0.3, Ql: 0.15 }];

      renderControls(buses, branches, BASE_MVA);
      renderDiagram();
      renderTables();
      updateLabels();
      wireEventListeners();
      solveNetwork(); // Initial solve
    }

    // Load scenario
    function loadScenario(scenarioId) {
      const scenario = scenarios[scenarioId];
      if (!scenario) return;

      initializeDemo();

      // Apply scenario modifications if needed
      if (scenarioId === '3ph') {
        // 3-phase fault scenario
        buses[0].Pl = 0.5;
      } else if (scenarioId === 'undervolt') {
        buses[0].Vset = 0.65;
      }

      solveNetwork();
    }

    // Wire event listeners — Task 6
    function wireEventListeners() {
      // Create action buttons in first panel
      const firstPanel = document.querySelector('.panel');
      if (firstPanel && !firstPanel.querySelector('button.primary')) {
        const btnContainer = document.createElement('div');
        btnContainer.style.cssText = 'display: flex; gap: 8px; margin-top: 12px;';

        const solveBtn = document.createElement('button');
        solveBtn.className = 'primary';
        solveBtn.textContent = '▶ Solve';
        solveBtn.onclick = solveNetwork;

        const resetBtn = document.createElement('button');
        resetBtn.textContent = '↺ Reset';
        resetBtn.onclick = () => {
          initializeDemo();
        };

        const exportBtn = document.createElement('button');
        exportBtn.textContent = '⬇ Export JSON';
        exportBtn.onclick = () => {
          const json = serializeNetwork({ buses, branches });
          const blob = new Blob([json], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `network-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
        };

        const comtradeBtn = document.createElement('button');
        comtradeBtn.textContent = '📊 COMTRADE';
        comtradeBtn.onclick = () => {
          if (!lastSolveResult) {
            alert('Run Solve first to generate COMTRADE data');
            return;
          }
          // Simple COMTRADE export (3 phases + timestamp)
          const timestamp = new Date().toISOString().slice(0, 19).replace('T', ' ');
          const cfg = `1,${timestamp}
1
0,2000
A
1,Ia,A,1,0
2,Ib,A,1,0
3,Ic,A,1,0
0
0,0,0,0
0`;
          const blob = new Blob([cfg], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `fault-${new Date().toISOString().slice(0, 10)}.cfg`;
          a.click();
          URL.revokeObjectURL(url);
        };

        btnContainer.appendChild(solveBtn);
        btnContainer.appendChild(resetBtn);
        btnContainer.appendChild(exportBtn);
        btnContainer.appendChild(comtradeBtn);
        firstPanel.appendChild(btnContainer);
      }

      // Wire scenario selector
      const scenarioSelect = document.getElementById('scenario-select');
      if (scenarioSelect) {
        scenarioSelect.addEventListener('change', (e) => {
          loadScenario(e.target.value);
        });
      }

      const loadscale = document.getElementById('loadscale');
      if (loadscale) {
        loadscale.addEventListener('input', (e) => {
          updateLabels();
          solveNetwork(); // Auto-solve on control change
        });
      }

      // Wire generator/load sliders
      document.querySelectorAll('input[type=range]').forEach(el => {
        el.addEventListener('input', (e) => {
          updateLabels();
          solveNetwork();
        });
      });
    }

    // Bridge Server: Listen for postMessage from React parent
    window.addEventListener('message', async (event) => {
      const { id, type, payload } = event.data;
      if (!id || !type) return;

      try {
        let result;
        if (type === 'solve') {
          applyControls(buses, branches, baseLoads, BASE_MVA);
          result = solvePowerFlow(buses, branches);
          renderDiagram();
        } else if (type === 'serialize') {
          result = serializeNetwork({ buses, branches });
        } else if (type === 'deserialize') {
          const data = deserializeNetwork(JSON.parse(payload));
          buses = data.buses || [];
          branches = data.branches || [];
          result = { success: true };
          renderControls(buses, branches, BASE_MVA);
          renderDiagram();
        } else {
          result = { error: 'Unknown message type' };
        }
        event.source.postMessage({ id, result });
      } catch (error) {
        event.source.postMessage({ id, error: error.message });
      }
    });

    // Initialize on load
    window.addEventListener('load', initializeDemo);

    // Export to global scope for debugging
    window.powerFlowState = { buses, branches, baseLoads, solveNetwork: () => solvePowerFlow(buses, branches) };
  </script>
</body>
</html>
