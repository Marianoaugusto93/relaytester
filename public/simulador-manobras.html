<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador de Manobras — Subestações</title>
<style>
  /* ── Chrome (UI) recolorido para a paleta RelayLab 360 ──────────────────
     IMPORTANTE: estas variáveis afetam apenas o "chrome" (header, painéis,
     botoes, SOE). A paleta do unifilar (VCOL/COL/voltColor/stateColor no
     bloco de logica) NAO e alterada — mantem o padrao de cores por nivel de tensao. */
  :root{
    --navy:#181b22;--navy-2:#0e1015;--navy-panel:#1e2129;--navy-line:#2a2e37;
    --gold:#f97316;--gold-soft:#fb923c;--teal:#0ea5e9;--mint:#4ade80;
    --slate:#8b93a5;--ink:#f0f0f5;--ink-dim:#9ca3b0;--danger:#f87171;--white:#fff;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,Menlo,monospace;
    --sans:"Inter","Helvetica Neue",Arial,"Liberation Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--navy-2);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
  header{background:var(--navy);border-bottom:3px solid var(--gold);padding:10px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:30px;height:30px;border-radius:50%;
    background:conic-gradient(from 210deg,var(--gold),var(--gold-soft),var(--gold));
    box-shadow:0 0 0 3px rgba(249,115,22,.15);position:relative;flex:none}
  .brand .mark::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--navy)}
  .titlebar{flex:1;min-width:180px}
  .titlebar h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
  .titlebar p{margin:2px 0 0;font-size:11px;color:var(--ink-dim)}
  .subpick{display:flex;align-items:center;gap:8px}
  .subpick label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
  .subpick select{padding:8px 10px;border-radius:8px;background:var(--navy-panel);color:var(--ink);
    border:1px solid var(--navy-line);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer}
  main{flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0}
  @media (max-width:880px){ main{grid-template-columns:1fr} }
  .stage{position:relative;overflow:hidden;background:radial-gradient(1200px 800px at 50% 0%, #161c2e 0%, var(--navy-2) 70%)}
  .stage svg{width:100%;height:100%;display:block}
  .legend{position:absolute;left:14px;bottom:14px;background:rgba(24,27,34,.82);
    border:1px solid var(--navy-line);border-radius:10px;padding:10px 12px;font-size:11px;backdrop-filter:blur(4px)}
  .legend .row{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--ink-dim)}
  .legend .sw{width:22px;height:4px;border-radius:2px}
  .legend .chip{width:13px;height:13px;border:2px solid;border-radius:2px}
  aside{background:var(--navy);border-left:1px solid var(--navy-line);display:flex;flex-direction:column;min-height:0}
  .panel{padding:16px;border-bottom:1px solid var(--navy-line)}
  .panel h2{margin:0 0 10px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
  .scen select{width:100%;padding:8px 10px;border-radius:8px;background:var(--navy-panel);color:var(--ink);
    border:1px solid var(--navy-line);font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer}
  .scen-desc{font-size:11.5px;color:var(--ink-dim);line-height:1.5;margin:10px 0}
  .scen-stat{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .badge{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--navy-panel);color:var(--ink-dim)}
  .badge.ok{background:rgba(74,222,128,.16);color:var(--mint)}
  .badge.pend{background:rgba(249,115,22,.14);color:var(--gold)}
  .badge.warn{background:rgba(248,113,113,.14);color:var(--danger)}
  .scen-score{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--mint);margin:6px 0 2px}
  .scen-hint{font-size:11px;color:var(--teal);background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.25);
    border-radius:7px;padding:7px 9px;margin-top:8px;line-height:1.45;display:none}
  .scen-hint.show{display:block}
  .scen-btns{display:flex;gap:8px;margin-top:10px}
  .scen-btns button{flex:1;padding:7px 0;border-radius:7px;border:1px solid var(--navy-line);background:transparent;
    color:var(--ink-dim);font-size:11px;font-weight:700;cursor:pointer;transition:.12s}
  .scen-btns button:hover{border-color:var(--teal);color:var(--teal)}
  .sel-empty{color:var(--ink-dim);font-size:13px;line-height:1.5}
  .sel-id{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--white)}
  .sel-type{font-size:12px;color:var(--ink-dim);margin:2px 0 12px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--navy-line)}
  .kv span:first-child{color:var(--ink-dim)}
  .kv span:last-child{font-family:var(--mono);font-weight:600}
  .state-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--mono)}
  .st-closed{background:rgba(249,115,22,.16);color:var(--gold)}
  .st-open{background:rgba(139,147,165,.22);color:var(--slate)}
  .st-gnd{background:rgba(74,222,128,.18);color:var(--mint)}
  .cmds{display:flex;gap:8px;margin-top:14px}
  .cmds button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--navy-line);
    font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.4px;cursor:pointer;transition:.12s;background:var(--navy-panel);color:var(--ink)}
  .cmds button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
  .cmds button:disabled{opacity:.32;cursor:not-allowed}
  .cmds button.act-open:hover:not(:disabled){border-color:var(--slate);color:var(--ink)}
  .cmds button.act-gnd:hover:not(:disabled){border-color:var(--mint);color:var(--mint)}
  .block-msg{margin-top:12px;padding:9px 11px;border-radius:8px;background:rgba(255,107,107,.10);
    border:1px solid rgba(255,107,107,.4);color:var(--danger);font-size:11.5px;line-height:1.45;display:none}
  .block-msg.show{display:block}
  .fault-btn{margin-top:14px;width:100%;padding:10px 0;border-radius:8px;border:1px solid rgba(255,107,107,.5);
    background:rgba(255,107,107,.10);color:var(--danger);font-size:12px;font-weight:700;letter-spacing:.4px;cursor:pointer;transition:.12s;font-family:var(--sans)}
  .fault-btn:hover{background:rgba(255,107,107,.2)}
  .fault-pick{margin-top:14px}
  .fault-pick label{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-dim);font-weight:700;margin-bottom:5px}
  .fault-pick select{width:100%;padding:7px 9px;border-radius:8px;background:var(--navy-panel);color:var(--ink);
    border:1px solid var(--navy-line);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer}
  .fault-pick+.fault-btn{margin-top:8px}
  .fail-toggle{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-dim);cursor:pointer}
  .fail-toggle .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--slate);flex:none}
  .fail-toggle.on .box{background:var(--danger);border-color:var(--danger)}
  .fail-toggle.on{color:var(--danger)}
  .toolbar{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
  .toolbar button{flex:1;min-width:80px;padding:8px 0;border-radius:8px;border:1px solid var(--navy-line);
    background:transparent;color:var(--ink-dim);font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:.12s}
  .toolbar button:hover{border-color:var(--teal);color:var(--teal)}
  .soe{flex:1;display:flex;flex-direction:column;min-height:120px}
  .soe h2{margin:14px 16px 8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
  .soe .list{flex:1;overflow:auto;padding:0 16px 16px;font-family:var(--mono);font-size:11px}
  .soe .entry{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(44,58,99,.5);line-height:1.4}
  .soe .entry .t{color:var(--teal);flex:none}
  .soe .entry .m{color:var(--ink-dim)}
  .soe .entry.cmd .m{color:var(--ink)}
  .soe .entry.block .m{color:var(--danger)}
  .soe .entry.alarm .m{color:#ff8a4c;font-weight:600}
  .soe .entry.trip .m{color:#ffd166}
  .soe .empty{color:var(--slate);font-style:italic;padding:8px 0}
  .device{cursor:pointer}
  .device:hover .hit{stroke:var(--gold);stroke-width:2;stroke-opacity:.5}
  .selected .hit{stroke:#ffffff;stroke-width:2.5;stroke-opacity:.9}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark"></div></div>
  <div class="titlebar">
    <h1>Simulador de Manobras &amp; Falhas em Subestações</h1>
    <p id="subTitle"></p>
  </div>
  <div class="subpick"><label>Subestação</label><select id="subSel"></select></div>
</header>
<main>
  <section class="stage">
    <svg id="sld" viewBox="0 0 1120 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Diagrama unifilar"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <aside>
    <div class="panel scen">
      <h2>Cenário de treinamento</h2>
      <select id="scenSel"></select>
      <div id="scenInfo"></div>
    </div>
    <div class="panel">
      <h2>Equipamento selecionado</h2>
      <div id="sel"><div class="sel-empty">Clique em um equipamento para inspecionar e operar. Clique em uma <b>barra</b>, <b>transformador</b> ou <b>alimentador</b> para aplicar uma falta 3φ.</div></div>
    </div>
    <div class="toolbar">
      <button id="btnNormal">Estado normal</button>
      <button id="btnAllOpen">Abrir tudo</button>
      <button id="btnMeas">Medições</button>
      <button id="btnFault">Remover falta</button>
    </div>
    <div class="soe">
      <h2>Sequência de eventos (SOE)</h2>
      <div class="list" id="soe"><div class="empty">Nenhuma manobra registrada.</div></div>
    </div>
  </aside>
</main>

<script>
/* =========================================================================
   SIMULADOR GENÉRICO DE SUBESTAÇÕES — dirigido por dados
   Cada subestação é um objeto autocontido (nós+coordenadas, ramos, fontes,
   cargas, proteção, zonas, cenários). O motor e o renderizador são genéricos.
   ========================================================================= */

/* ---------- PALETA POR NÍVEL DE TENSÃO ---------------------------------- */
const VCOL={ "230":"#FF7AB6","138":"#FDB805","69":"#FF9F45","34.5":"#5BD1E0","13.8":"#07B494","6.9":"#8FD14F" };
const COL={ deadLine:"#717ea8",dead:"#5d6a93",busDead:"#46527d",mint:"#3DDC97" };
function vcol(kV){ return VCOL[String(kV)]||"#FDB805"; }
function voltColor(kV,live){ return live?vcol(kV):COL.deadLine; }
function stateColor(live,gnd,kV){ if(live) return vcol(kV); if(gnd) return COL.mint; return COL.deadLine; }

/* =========================================================================
   REGISTRO DE SUBESTAÇÕES
   ========================================================================= */
const SUBSTATIONS={};

/* ---- SE-A : 138/13,8 kV, dupla entrada, barra seccionada -------------- */
SUBSTATIONS.A={
  name:"SE-A · 138/13,8 kV — Rebaixadora (barra seccionada)",
  subtitle:"Dupla entrada · 2 trafos 25 MVA · 4 alimentadores · gerador",
  baseMVA:100, voltages:[138,13.8],
  nodes:{
    LT1:{kind:"point",x:280,y:52,kV:138}, MID1:{kind:"point",x:280,y:118,kV:138},
    B138A:{kind:"bus",x:150,y:212,x2:520,kV:138,label:"BARRA 138 kV — A"},
    LT2:{kind:"point",x:840,y:52,kV:138}, MID2:{kind:"point",x:840,y:118,kV:138},
    B138B:{kind:"bus",x:600,y:212,x2:980,kV:138,label:"BARRA 138 kV — B"},
    T1P:{kind:"point",x:280,y:300,kV:138}, T1S:{kind:"point",x:280,y:372,kV:13.8},
    T2P:{kind:"point",x:840,y:300,kV:138}, T2S:{kind:"point",x:840,y:372,kV:13.8},
    B13A:{kind:"bus",x:120,y:452,x2:520,kV:13.8,label:"BARRA 13,8 kV — A"},
    B13B:{kind:"bus",x:600,y:452,x2:1000,kV:13.8,label:"BARRA 13,8 kV — B"},
    GER:{kind:"point",x:948,y:600,kV:13.8},
    AL1:{kind:"point",x:200,y:600,kV:13.8}, AL2:{kind:"point",x:360,y:600,kV:13.8},
    AL3:{kind:"point",x:688,y:600,kV:13.8}, AL4:{kind:"point",x:824,y:600,kV:13.8}
  },
  edges:{
    SC1:{type:"disconnector",a:"LT1",b:"MID1",state:"closed",series:"DJ1",kV:138,label:"SC-1",x:280,y:118},
    DJ1:{type:"breaker",a:"MID1",b:"B138A",state:"closed",kV:138,label:"DJ-1",x:280,y:168},
    SC2:{type:"disconnector",a:"LT2",b:"MID2",state:"closed",series:"DJ2",kV:138,label:"SC-2",x:840,y:118},
    DJ2:{type:"breaker",a:"MID2",b:"B138B",state:"closed",kV:138,label:"DJ-2",x:840,y:168},
    DJINT138:{type:"breaker",a:"B138A",b:"B138B",state:"open",kV:138,label:"DJ-I 138",x:560,y:212},
    DJT1:{type:"breaker",a:"B138A",b:"T1P",state:"closed",kV:138,label:"DJ-T1",x:280,y:256},
    TR1:{type:"transformer",a:"T1P",b:"T1S",kV:138,kVsec:13.8,mva:25,Zpct:10.5,XR:20,vector:"Dyn",label:"TR-01",ratio:"138/13,8",x:280,y:336},
    DJBT1:{type:"breaker",a:"T1S",b:"B13A",state:"closed",kV:13.8,label:"DJ-BT1",x:280,y:412},
    DJT2:{type:"breaker",a:"B138B",b:"T2P",state:"closed",kV:138,label:"DJ-T2",x:840,y:256},
    TR2:{type:"transformer",a:"T2P",b:"T2S",kV:138,kVsec:13.8,mva:25,Zpct:10.5,XR:20,vector:"Dyn",label:"TR-02",ratio:"138/13,8",x:840,y:336},
    DJBT2:{type:"breaker",a:"T2S",b:"B13B",state:"closed",kV:13.8,label:"DJ-BT2",x:840,y:412},
    DJINT13:{type:"breaker",a:"B13A",b:"B13B",state:"open",kV:13.8,label:"DJ-I 13,8",x:560,y:452},
    DJG:{type:"breaker",a:"GER",b:"B13B",state:"open",kV:13.8,label:"DJ-G",x:948,y:512,sync:true},
    DJAL1:{type:"breaker",a:"B13A",b:"AL1",state:"closed",kV:13.8,label:"DJ-AL01",x:200,y:512},
    DJAL2:{type:"breaker",a:"B13A",b:"AL2",state:"closed",kV:13.8,label:"DJ-AL02",x:360,y:512},
    DJAL3:{type:"breaker",a:"B13B",b:"AL3",state:"closed",kV:13.8,label:"DJ-AL03",x:688,y:512},
    DJAL4:{type:"breaker",a:"B13B",b:"AL4",state:"closed",kV:13.8,label:"DJ-AL04",x:824,y:512},
    GNDT1:{type:"ground",node:"T1P",state:"open",kV:138,label:"GND-T1",x:280,y:288,side:-1},
    GNDT2:{type:"ground",node:"T2P",state:"open",kV:138,label:"GND-T2",x:840,y:288,side:1},
    GNDAL1:{type:"ground",node:"AL1",state:"open",kV:13.8,label:"GND-AL01",x:200,y:556,side:1},
    GNDAL2:{type:"ground",node:"AL2",state:"open",kV:13.8,label:"GND-AL02",x:360,y:556,side:1},
    GNDAL3:{type:"ground",node:"AL3",state:"open",kV:13.8,label:"GND-AL03",x:688,y:556,side:1},
    GNDAL4:{type:"ground",node:"AL4",state:"open",kV:13.8,label:"GND-AL04",x:824,y:556,side:1}
  },
  sources:{
    LT1:{node:"LT1",kV:138,Scc_MVA:1500,XR:10,type:"grid",label:"LT 138 kV",x:280,y:52},
    LT2:{node:"LT2",kV:138,Scc_MVA:1500,XR:10,type:"grid",label:"LT 138 kV",x:840,y:52},
    GER:{node:"GER",kV:13.8,MVA:15,Xdpp:0.18,Xd2:0.22,XR:30,type:"gen",label:"GER-01",x:948,y:600}
  },
  feeders:{
    AL1:{node:"AL1",P:4.0,Q:1.9,r:0.30,xl:0.40,km:6,kV:13.8,label:"AL-01",x:200,y:600},
    AL2:{node:"AL2",P:3.2,Q:1.5,r:0.30,xl:0.40,km:8,kV:13.8,label:"AL-02",x:360,y:600},
    AL3:{node:"AL3",P:4.5,Q:2.2,r:0.30,xl:0.40,km:5,kV:13.8,label:"AL-03",x:688,y:600},
    AL4:{node:"AL4",P:2.8,Q:1.3,r:0.30,xl:0.40,km:10,kV:13.8,label:"AL-04",x:824,y:600}
  },
  prot:{
    DJAL1:{p51:{pickup:300,curve:"IEC-VI",TMS:0.15},p50:{pickup:3000,t:0.03},p51n:{pickup:60,curve:"IEC-VI",TMS:0.10},p50n:{pickup:1200,t:0.05},p79:{dead:[0.5,3.0]}},
    DJAL2:{p51:{pickup:300,curve:"IEC-VI",TMS:0.15},p50:{pickup:3000,t:0.03},p51n:{pickup:60,curve:"IEC-VI",TMS:0.10},p50n:{pickup:1200,t:0.05},p79:{dead:[0.5,3.0]}},
    DJAL3:{p51:{pickup:300,curve:"IEC-VI",TMS:0.15},p50:{pickup:3000,t:0.03},p51n:{pickup:60,curve:"IEC-VI",TMS:0.10},p50n:{pickup:1200,t:0.05},p79:{dead:[0.5,3.0]}},
    DJAL4:{p51:{pickup:300,curve:"IEC-VI",TMS:0.15},p50:{pickup:3000,t:0.03},p51n:{pickup:60,curve:"IEC-VI",TMS:0.10},p50n:{pickup:1200,t:0.05},p79:{dead:[0.5,3.0]}},
    DJBT1:{p51:{pickup:600,curve:"IEC-VI",TMS:0.30},p51n:{pickup:120,curve:"IEC-VI",TMS:0.35}},
    DJBT2:{p51:{pickup:600,curve:"IEC-VI",TMS:0.30},p51n:{pickup:120,curve:"IEC-VI",TMS:0.35}},
    DJT1:{p51:{pickup:150,curve:"IEC-VI",TMS:0.35}}, DJT2:{p51:{pickup:150,curve:"IEC-VI",TMS:0.35}},
    DJ1:{p51:{pickup:150,curve:"IEC-VI",TMS:0.45}}, DJ2:{p51:{pickup:150,curve:"IEC-VI",TMS:0.45}}
  },
  zones:{
    TR1:{type:"87T",t:0.04,trips:["DJT1","DJBT1"]}, TR2:{type:"87T",t:0.04,trips:["DJT2","DJBT2"]},
    B13A:{type:"87B",t:0.05,bus:"B13A"}, B13B:{type:"87B",t:0.05,bus:"B13B"},
    B138A:{type:"87B",t:0.06,bus:"B138A"}, B138B:{type:"87B",t:0.06,bus:"B138B"}
  },
  scenarios:{
    A1:{title:"A1 · Energização de bay",
      desc:"A Seção A está desenergizada (SC-1 e DJ-1 abertos). Energize a barra 13,8 kV — A respeitando a sequência seccionadora → disjuntor.",
      setup:()=>{ resetNormal(); S.edges.SC1.state="open"; S.edges.DJ1.state="open"; },
      objective:()=>energ().has("B13A"), optimal:2,
      hint:"Feche a SC-1 (sem carga) e depois o DJ-1."},
    A2:{title:"A2 · Isolar e aterrar transformador",
      desc:"Coloque o TR-01 em condição segura para manutenção: isolado em alta e baixa, e aterrado.",
      setup:()=>resetNormal(),
      objective:()=>S.edges.DJT1.state==="open"&&S.edges.DJBT1.state==="open"&&S.edges.GNDT1.state==="closed",
      optimal:3, hint:"Abra DJ-BT1 e DJ-T1; só então a lâmina GND-T1 fecha."},
    A3:{title:"A3 · Transferência de barra (socorro)",
      desc:"A LT1 saiu (DJ-1 aberto) e a Seção A está morta. Restabeleça AL-01 e AL-02 socorrendo pela Seção B.",
      setup:()=>{ resetNormal(); S.edges.DJ1.state="open"; },
      objective:()=>energ().has("AL1")&&energ().has("AL2"), optimal:2,
      hint:"Feche as interligações DJ-I 138 e DJ-I 13,8."},
    A4:{title:"A4 · Entrada do gerador (sincronismo)",
      desc:"Coloque o GER-01 em paralelo com a barra 13,8 kV — B (energizada). Verifique o sincronismo antes de fechar o DJ-G.",
      setup:()=>resetNormal(),
      objective:()=>S.edges.DJG.state==="closed", optimal:1,
      hint:"Selecione o DJ-G, clique Sincronizar e depois feche."},
    B7:{title:"B7 · Perda de transformador + transferência",
      desc:"Falta interna no TR-01: a 87T isolou o transformador. Restabeleça AL-01/AL-02 pela Seção B mantendo o trafo isolado.",

/* =========================================================================
   ESTADO ATIVO
   ========================================================================= */
let S=null, NORMAL={}, syncedG={}, selected=null, showMeas=true;
let activeFault=null, SOL={busScc:{},busV:{},branchI:{}};
const Sbase=()=>S.baseMVA;
const nodeKv=n=>S.nodes[n].kV;

/* =========================================================================
   MOTOR — energização, aterramento
   ========================================================================= */
function conducts(e){ if(e.type==="transformer"||e.type==="line") return true; if(e.type==="ground") return false; return e.state==="closed"; }
function groundedNodes(){ const s=new Set(); for(const e of Object.values(S.edges)) if(e.type==="ground"&&e.state==="closed") s.add(e.node); return s; }
function srcNodes(){ return Object.values(S.sources).map(s=>s.node); }
function computeEnergization(){
  const adj={}; Object.keys(S.nodes).forEach(n=>adj[n]=[]);
  for(const [id,e] of Object.entries(S.edges)){ if(!conducts(e)) continue; adj[e.a].push({node:e.b,edge:id}); adj[e.b].push({node:e.a,edge:id}); }
  const energized=new Set(srcNodes()); const q=[...energized];
  while(q.length){ const c=q.shift(); for(const nb of adj[c]) if(!energized.has(nb.node)){ energized.add(nb.node); q.push(nb.node); } }
  const liveEdges=new Set();
  for(const [id,e] of Object.entries(S.edges)) if(conducts(e)&&(energized.has(e.a)||energized.has(e.b))) liveEdges.add(id);
  return {nodes:energized,edges:liveEdges};
}

/* =========================================================================
   SOLVER ELÉTRICO
   ========================================================================= */
const cx=(re,im=0)=>({re,im});
const cadd=(a,b)=>({re:a.re+b.re,im:a.im+b.im});
const csub=(a,b)=>({re:a.re-b.re,im:a.im-b.im});
const cmul=(a,b)=>({re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re});
const cdiv=(a,b)=>{const d=b.re*b.re+b.im*b.im;return{re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d};};
const cabs=a=>Math.hypot(a.re,a.im);
const cinv=a=>cdiv(cx(1,0),a);
function zFromXR(absZ,xr){const th=Math.atan(xr);return cx(absZ*Math.cos(th),absZ*Math.sin(th));}
function cMatInv(M){
  const n=M.length;
  const A=M.map((row,i)=>row.map(v=>({...v})).concat(Array.from({length:n},(_,j)=>cx(i===j?1:0,0))));
  for(let col=0;col<n;col++){
    let piv=col; for(let r=col+1;r<n;r++) if(cabs(A[r][col])>cabs(A[piv][col])) piv=r;
    [A[col],A[piv]]=[A[piv],A[col]];
    const d=A[col][col]; for(let j=0;j<2*n;j++) A[col][j]=cdiv(A[col][j],d);
    for(let r=0;r<n;r++){ if(r===col)continue; const f=A[r][col]; for(let j=0;j<2*n;j++) A[r][j]=csub(A[r][j],cmul(f,A[col][j])); }
  }
  return A.map(row=>row.slice(n));
}
const ibase=kV=>Sbase()*1e6/(Math.sqrt(3)*kV*1000);
function feederZpu(ln){ const f=S.feeders[ln]; const Zb=f.kV*f.kV/Sbase(); return cx(f.r*f.km/Zb,f.xl*f.km/Zb); }
function trZpu(e){ return zFromXR((e.Zpct/100)*(Sbase()/e.mva),e.XR); }

function electricalSolve(E){
  const parent={}; Object.keys(S.nodes).forEach(n=>parent[n]=n);
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
  for(const e of Object.values(S.edges)) if((e.type==="breaker"||e.type==="disconnector")&&e.state==="closed") parent[find(e.a)]=find(e.b);
  const sn=n=>find(n);
  const liveSN=new Set(); for(const n of E.nodes) liveSN.add(sn(n));
  const snList=[...liveSN]; const idx={}; snList.forEach((s,i)=>idx[s]=i); const n=snList.length;
  const Y=Array.from({length:n},()=>Array.from({length:n},()=>cx(0,0)));
  for(const p of Object.values(S.sources)){
    if(!E.nodes.has(p.node)) continue; const i=idx[sn(p.node)]; if(i===undefined) continue;
    const Zs=p.Scc_MVA?zFromXR(Sbase()/p.Scc_MVA,p.XR):zFromXR(p.Xdpp*(Sbase()/p.MVA),p.XR);
    Y[i][i]=cadd(Y[i][i],cinv(Zs));
  }
  for(const e of Object.values(S.edges)){
    if(e.type!=="transformer") continue; if(!E.nodes.has(e.a)||!E.nodes.has(e.b)) continue;
    const i=idx[sn(e.a)],j=idx[sn(e.b)]; if(i===undefined||j===undefined||i===j) continue;
    const y=cinv(trZpu(e)); Y[i][i]=cadd(Y[i][i],y); Y[j][j]=cadd(Y[j][j],y); Y[i][j]=csub(Y[i][j],y); Y[j][i]=csub(Y[j][i],y);
  }
  let Z=null; if(n>0){ try{Z=cMatInv(Y);}catch(_){ } }
  const busScc={}, busV={};
  const busNodes=Object.keys(S.nodes).filter(id=>S.nodes[id].kind==="bus");
  for(const b of busNodes){
    if(!E.nodes.has(b)||!Z){ busScc[b]=null; continue; }
    const i=idx[sn(b)]; if(i===undefined){ busScc[b]=null; continue; }
    const Zth=Z[i][i]; if(!isFinite(cabs(Zth))||cabs(Zth)===0){ busScc[b]=null; continue; }
    const kvB=S.nodes[b].kV; const Icc=cabs(cinv(Zth))*ibase(kvB);
    busScc[b]={kA:Icc/1000,MVA:Math.sqrt(3)*kvB*Icc/1000};
  }
  /* fluxo radial */
  const adj={}; Object.keys(S.nodes).forEach(x=>adj[x]=[]);
  for(const [id,e] of Object.entries(S.edges)){ if(!conducts(e)) continue; adj[e.a].push({to:e.b,id}); adj[e.b].push({to:e.a,id}); }
  const parentEdge={}, order=[], vis=new Set(), q=[];
  for(const s of srcNodes()) if(E.nodes.has(s)&&!vis.has(s)){ vis.add(s); q.push(s); }
  while(q.length){ const c=q.shift(); order.push(c); for(const nb of adj[c]) if(!vis.has(nb.to)){ vis.add(nb.to); parentEdge[nb.to]={from:c,id:nb.id}; q.push(nb.to); } }
  const nodeLoad={}; Object.keys(S.nodes).forEach(x=>nodeLoad[x]=cx(0,0));
  for(const [ln,f] of Object.entries(S.feeders)) if(E.nodes.has(ln)) nodeLoad[ln]=cx(f.P,f.Q);
  const downS={}; order.forEach(x=>downS[x]=cx(0,0));
  for(let k=order.length-1;k>=0;k--){ const x=order[k]; downS[x]=cadd(downS[x],nodeLoad[x]); const pe=parentEdge[x]; if(pe) downS[pe.from]=cadd(downS[pe.from],downS[x]); }
  const branchI={};
  for(const [child,pe] of Object.entries(parentEdge)){ const Ss=downS[child], kvB=nodeKv(child); branchI[pe.id]={A:cabs(Ss)*1e6/(Math.sqrt(3)*kvB*1000),S:cabs(Ss),P:Ss.re,Q:Ss.im}; }
  const Vpu={}; for(const s of srcNodes()) if(E.nodes.has(s)) Vpu[s]=1.0;
  for(const x of order){ if(Vpu[x]!==undefined) continue; const pe=parentEdge[x]; if(!pe){ Vpu[x]=1.0; continue; }
    const e=S.edges[pe.id]; let Zb=cx(0,0);
    if(S.feeders[x]) Zb=feederZpu(x); else if(e.type==="transformer") Zb=trZpu(e);
    const Ss=downS[x], Vp=Vpu[pe.from]||1.0; const drop=(Ss.re/Sbase()*Zb.re+Ss.im/Sbase()*Zb.im)/Vp; Vpu[x]=Vp-drop;
  }
  for(const b of busNodes) busV[b]=E.nodes.has(b)?{pu:Vpu[b]??1.0,kV:S.nodes[b].kV*(Vpu[b]??1.0)}:null;
  function zthAt(node){ if(!E.nodes.has(node)||!Z) return null; const i=idx[sn(node)]; if(i===undefined) return null; return Z[i][i]; }
  return {busScc,busV,branchI,zthAt,parentEdge,vpre:1.0};
}

/* =========================================================================
   REDES DE SEQUÊNCIA (0/1/2) — base p/ faltas 1φ / 2φ / 2φ-T e 50N/51N
   -------------------------------------------------------------------------
   Z1: fontes como shunt 1/Z1, trafos como série 1/Zt (igual ao solver 3φ).
   Z2: rede/trafo/linha = Z1 (passivos); máquinas usam Xd2 (≈(Xd″+Xq″)/2, def. Xdpp), XR2 (def. XR).
   Z0: topologia depende do grupo vetorial do trafo e do aterramento das
       fontes. Delta bloqueia a passagem; estrela-aterrada referencia à terra.
   ========================================================================= */
/* modelo de sequência-zero por grupo vetorial (a = AT/topo, b = BT/baixo) */
const Z0MODELS={
  "DYN": {through:false,gndA:false,gndB:true },  // delta AT · estrela-aterr. BT
  "YND": {through:false,gndA:true, gndB:false},  // estrela-aterr. AT · delta BT
  "YNYN":{through:true, gndA:false,gndB:false},  // ambos estrela-aterr.: série
  "DD":  {through:false,gndA:false,gndB:false},  // delta-delta: bloqueia
  "YY":  {through:false,gndA:false,gndB:false}   // estrela isolada: bloqueia
};
function trZ0Model(e){ return Z0MODELS[(e.vector||"YNYN").toUpperCase()]||Z0MODELS["YNYN"]; }
const cscale=(z,k)=>cx(z.re*k,z.im*k);
function feederZ0pu(ln){ const f=S.feeders[ln]; const Zb=f.kV*f.kV/Sbase(); const k=f.x0x1??3; return cx(f.r*k*f.km/Zb,f.xl*k*f.km/Zb); }

/* resolve Thévenin de sequência `seq` (0,1,2) em qualquer nó energizado */
function seqSolve(E,seq){
  const parent={}; Object.keys(S.nodes).forEach(n=>parent[n]=n);
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
  for(const e of Object.values(S.edges)) if((e.type==="breaker"||e.type==="disconnector")&&e.state==="closed") parent[find(e.a)]=find(e.b);
  const sn=n=>find(n);
  const live=[...new Set([...E.nodes].map(sn))]; const idx={}; live.forEach((s,i)=>idx[s]=i); const n=live.length;
  const Y=Array.from({length:n},()=>Array.from({length:n},()=>cx(0,0)));
  const adj=Array.from({length:n},()=>[]); const shunted=new Array(n).fill(false);
  const addSeries=(a,b,y)=>{ const i=idx[sn(a)],j=idx[sn(b)]; if(i===undefined||j===undefined||i===j) return;
    Y[i][i]=cadd(Y[i][i],y);Y[j][j]=cadd(Y[j][j],y);Y[i][j]=csub(Y[i][j],y);Y[j][i]=csub(Y[j][i],y); adj[i].push(j);adj[j].push(i); };
  const addShunt=(node,y)=>{ const i=idx[sn(node)]; if(i===undefined) return; Y[i][i]=cadd(Y[i][i],y); shunted[i]=true; };
  for(const p of Object.values(S.sources)){
    if(!E.nodes.has(p.node)) continue;
    const Z1=p.Scc_MVA?zFromXR(Sbase()/p.Scc_MVA,p.XR):zFromXR(p.Xdpp*(Sbase()/p.MVA),p.XR);
    if(seq===1){ addShunt(p.node,cinv(Z1)); }
    else if(seq===2){
      // seq-negativa: rede (grid) é simétrica (Z2=Z1); máquina usa Xd2≈(Xd″+Xq″)/2, default Xd″
      const Z2=p.Scc_MVA?Z1:zFromXR((p.Xd2??p.Xdpp)*(Sbase()/p.MVA),p.XR2??p.XR);
      addShunt(p.node,cinv(Z2)); }
    else { const grounded=p.type==="grid"?(p.grnd!==false):(p.grnd===true); if(!grounded) continue;
      let Z0=cscale(Z1,p.x0x1??1); if(p.Zg) Z0=cadd(Z0,cx(3*p.Zg,0)); addShunt(p.node,cinv(Z0)); }
  }
  for(const e of Object.values(S.edges)){
    if(e.type!=="transformer") continue; if(!E.nodes.has(e.a)||!E.nodes.has(e.b)) continue;
    const zt=trZpu(e);
    if(seq===1||seq===2){ addSeries(e.a,e.b,cinv(zt)); }
    else { const m=trZ0Model(e);
      if(m.through){ addSeries(e.a,e.b,cinv(zt)); }
      else { if(m.gndA) addShunt(e.a,cinv(zt)); if(m.gndB) addShunt(e.b,cinv(zt)); } }
  }
  const comp=new Array(n).fill(-1); let nc=0;
  for(let s=0;s<n;s++) if(comp[s]<0){ const st=[s]; comp[s]=nc; while(st.length){ const c=st.pop(); for(const nb of adj[c]) if(comp[nb]<0){ comp[nb]=nc; st.push(nb); } } nc++; }
  const ref=new Array(nc).fill(false); for(let i=0;i<n;i++) if(shunted[i]) ref[comp[i]]=true;
  const Zdiag={};
  for(let c=0;c<nc;c++){ if(!ref[c]) continue; const mem=[]; for(let i=0;i<n;i++) if(comp[i]===c) mem.push(i);
    let Zi; try{ Zi=cMatInv(mem.map(r=>mem.map(cc=>Y[r][cc]))); }catch(_){ continue; }
    mem.forEach((gi,li)=>{ Zdiag[gi]=Zi[li][li]; }); }
  return { zAt(node){ if(!E.nodes.has(node)) return null; const i=idx[sn(node)]; if(i===undefined) return null; return Zdiag[i]??null; } };
}

/* correntes de sequência por tipo de falta (E=1∠0 pu) */
function seqCurr(Z1,Z2,Z0,ftype){
  const E=cx(1,0), Z=cadd; const zero=cx(0,0);
  if(ftype==="3ph"){ const I1=cdiv(E,Z1); return {I0:zero,I1,I2:zero}; }
  if(ftype==="2ph"){ const I1=cdiv(E,Z(Z1,Z2)); return {I0:zero,I1,I2:cx(-I1.re,-I1.im)}; }
  if(ftype==="1ph"){ if(!Z0) return null; const I=cdiv(E,Z(Z(Z1,Z2),Z0)); return {I0:I,I1:I,I2:I}; }
  if(ftype==="2phg"){ if(!Z0) return seqCurr(Z1,Z2,Z0,"2ph"); /* sem terra → vira L-L */
    const Zp=cdiv(cmul(Z2,Z0),Z(Z2,Z0)); const I1=cdiv(E,Z(Z1,Zp));
    const I2=cmul(I1,cdiv(cx(-Z0.re,-Z0.im),Z(Z2,Z0))); const I0=cmul(I1,cdiv(cx(-Z2.re,-Z2.im),Z(Z2,Z0)));
    return {I0,I1,I2}; }
  const I1=cdiv(E,Z1); return {I0:zero,I1,I2:zero};
}
/* componentes simétricas → fasores de fase */
const AOP=cx(Math.cos(2*Math.PI/3),Math.sin(2*Math.PI/3)), AOP2=cx(Math.cos(-2*Math.PI/3),Math.sin(-2*Math.PI/3));
function abcFromSeq(s){
  return { Ia:cadd(cadd(s.I0,s.I1),s.I2),
           Ib:cadd(cadd(s.I0,cmul(AOP2,s.I1)),cmul(AOP,s.I2)),
           Ic:cadd(cadd(s.I0,cmul(AOP,s.I1)),cmul(AOP2,s.I2)) };
}
const FTYPES={"3ph":"Trifásica (3φ)","2ph":"Bifásica (2φ · F-F)","1ph":"Monofásica (1φ · F-T)","2phg":"Bifásica-terra (2φ-T)"};

/* =========================================================================
   INTERTRAVAMENTO
   ========================================================================= */
function canOperate(id,newState){
  const e=S.edges[id];
  if(e.type==="disconnector"&&e.series){ const dj=S.edges[e.series];
    if(dj.state==="closed") return {ok:false,reason:`Seccionadora ${e.label} bloqueada — abra o disjuntor ${dj.label} antes. Seccionadora não manobra sob carga.`}; }
  if(e.type==="ground"&&newState==="closed"){ if(computeEnergization().nodes.has(e.node))
    return {ok:false,reason:`Lâmina de terra ${e.label} bloqueada — trecho energizado. Desenergize antes de aterrar.`}; }
  if(e.type==="breaker"&&newState==="closed"){
    const saved=e.state; e.state="closed"; const live=computeEnergization().nodes; e.state=saved;
    const gnd=groundedNodes(); for(const n of gnd) if(live.has(n))
      return {ok:false,reason:`${e.label} bloqueado — fecharia sobre aterramento ativo em ${n}. Remova a lâmina de terra antes de energizar.`};
  }
  if(e.sync&&newState==="closed"){ const other=e.a, otherB=e.b;
    const busSide=S.nodes[e.a].kind==="bus"?e.a:e.b;
    if(computeEnergization().nodes.has(busSide)&&!syncedG[id])
      return {ok:false,reason:`${e.label} bloqueado — máquina fora de sincronismo. Verifique V, f e ângulo (Sincronizar) antes de paralelar com a barra energizada.`};
  }
  return {ok:true};
}

/* =========================================================================
   PROTEÇÃO
   ========================================================================= */
const CURVES={ "IEC-SI":{A:0.14,p:0.02},"IEC-VI":{A:13.5,p:1},"IEC-EI":{A:80,p:2},"IEEE-MI":{A:0.0515,B:0.114,p:0.02},"IEEE-VI":{A:19.61,B:0.491,p:2} };
function opTime(set,Iref){ const M=Iref/set.pickup; if(M<=1.05) return Infinity; const c=CURVES[set.curve];
  if(c.B!==undefined) return set.TMS*(c.A/(Math.pow(M,c.p)-1)+c.B); return set.TMS*c.A/(Math.pow(M,c.p)-1); }
const T_50BF=0.20;
function breakersOnBus(bus){ return Object.keys(S.edges).filter(id=>{ const e=S.edges[id]; return e.type==="breaker"&&(e.a===bus||e.b===bus); }); }
function pathBreakers(node,parentEdge){ const path=[]; let cur=node,g=0; while(parentEdge[cur]&&g++<60){ const pe=parentEdge[cur]; if(S.edges[pe.id].type==="breaker") path.push(pe.id); cur=pe.from; } return path; }

function resolveFault(at,kind,ftype){
  ftype=ftype||"3ph";
  const E=computeEnergization(); const sol=electricalSolve(E);
  if(kind!=="transformer"&&!E.nodes.has(at)) return {ok:false,reason:"Ponto de falta desenergizado — nada a proteger."};
  const s1=seqSolve(E,1), s2=seqSolve(E,2), s0=seqSolve(E,0);
  /* nó elétrico e tensão do ponto de falta */
  let kvF, fn;
  if(kind==="feeder"){ kvF=S.feeders[at].kV; fn=at; }
  else if(kind==="bus"){ kvF=S.nodes[at].kV; fn=at; }
  else { const e=S.edges[at]; kvF=e.kVsec||e.kV; fn=e.b; }
  let Z1=s1.zAt(fn); let Z2=s2.zAt(fn); let Z0=s0.zAt(fn);
  if(!Z1){ const e=S.edges[at]; Z1=s1.zAt(e?.a)||cx(0.5,0); if(!Z2) Z2=s2.zAt(e?.a); if(Z0===null&&e) Z0=s0.zAt(e.a); }
  if(!Z1) return {ok:false,reason:kind==="bus"?"Barra desenergizada.":"Sem fonte para o ponto."};
  if(!Z2) Z2=Z1;                                // sem retorno de seq-negativa → Z2≈Z1 (rede passiva)
  if(kind==="feeder"){ Z1=cadd(Z1,feederZpu(at)); Z2=cadd(Z2,feederZpu(at)); if(Z0) Z0=cadd(Z0,feederZ0pu(at)); }
  /* correntes de sequência → fasores de fase → grandezas para a proteção */
  const sc=seqCurr(Z1,Z2,Z0,ftype);
  if(!sc) return {ok:true,If:0,I3I0:0,kVf:kvF,ftype,seq:[],cleared:false,
    note:`Ponto sem retorno de sequência-zero (sistema não aterrado aqui) — falta ${FTYPES[ftype]} produz corrente de terra desprezível.`};
  const ph=abcFromSeq(sc); const Ib=ibase(kvF);
  const Iph=Math.max(cabs(ph.Ia),cabs(ph.Ib),cabs(ph.Ic))*Ib;   // maior corrente de fase (50/51)
  const I3I0=3*cabs(sc.I0)*Ib;                                   // corrente de terra 3I0 (50N/51N)
  const If=Iph;
  activeFault={at,kind,ftype,If,I3I0,kV:kvF};
  const closedOnly=ids=>ids.filter(id=>S.edges[id].state==="closed");
  const ops=[];
  if(kind==="transformer"){ const z=S.zones[at]; if(z) ops.push({t:z.t,trips:closedOnly(z.trips),by:`87T ${S.edges[at].label}`}); }
  if(kind==="bus"){ const z=S.zones[at]; if(z) ops.push({t:z.t,trips:closedOnly(breakersOnBus(at)),by:`87B ${at}`}); }
  /* percurso radial até a fonte: coleta disjuntores e detecta onde o delta
     bloqueia a sequência-zero (3I0 só circula no lado aterrado da falta). */
  const startNode=kind==="transformer"?S.edges[at].b:at;
  let gndReach=I3I0>0.5;
  const pathEdges=(()=>{const p=[];let c=startNode,k=0;while(sol.parentEdge[c]&&k++<60){p.push(sol.parentEdge[c].id);c=sol.parentEdge[c].from;}return p;})();
  for(const id of pathEdges){
    const e=S.edges[id];
    if(e.type==="breaker"){
      const set=S.prot[id]; if(set){
        const Iref=If*(kvF/e.kV);                 // fase referida ao nível do equipamento
        if(set.p50&&Iref>set.p50.pickup) ops.push({t:set.p50.t,trips:[id],by:`50 ${e.label}`,I:Iref});
        else if(set.p51){ const t=opTime(set.p51,Iref); if(isFinite(t)) ops.push({t,trips:[id],by:`51 ${e.label}`,I:Iref}); }
        if(gndReach){ const I0ref=I3I0*(kvF/e.kV);  // terra referida ao nível do equipamento
          if(set.p50n&&I0ref>set.p50n.pickup) ops.push({t:set.p50n.t,trips:[id],by:`50N ${e.label}`,I:I0ref});
          else if(set.p51n){ const t=opTime(set.p51n,I0ref); if(isFinite(t)) ops.push({t,trips:[id],by:`51N ${e.label}`,I:I0ref}); } }
      }
    } else if(e.type==="transformer"){ if(!trZ0Model(e).through) gndReach=false; }  // delta bloqueia 3I0 a montante
  }
  if(!ops.length) return {ok:true,If,I3I0,kVf:kvF,ftype,seq:[],cleared:false,note:"Nenhuma proteção sensibilizada."};
  ops.sort((a,b)=>a.t-b.t);
  const seq=[]; let cleared=false, bfTime=null;
  for(const op of ops){ const opened=[];
    for(const id of op.trips){ if(S.edges[id].state==="open") continue;
      if(S.edges[id].failed){ seq.push({t:op.t,msg:`${op.by}: TRIP em ${S.edges[id].label} — DISJUNTOR RECUSOU`}); if(bfTime===null) bfTime=op.t; }
      else { S.edges[id].state="open"; S.edges[id].tripped=true; opened.push(S.edges[id].label); } }
    if(opened.length){ const eff=bfTime!==null?bfTime+T_50BF:op.t; const tag=bfTime!==null?" [50BF retaguarda]":"";
      seq.push({t:eff,msg:`${op.by} → TRIP ${opened.join(", ")} (Iref=${Math.round(op.I||If)} A)${tag}`});
      const liveNow=computeEnergization().nodes;
      const stillFed=kind==="transformer"?(liveNow.has(S.edges[at].a)||liveNow.has(S.edges[at].b)):liveNow.has(at);
      if(!stillFed){ cleared=true; break; } } }
  seq.sort((a,b)=>a.t-b.t);
  return {ok:true,If,I3I0,kVf:kvF,ftype,seq,cleared};
}
function clearFault(){ activeFault=null; }

const NS="http://www.w3.org/2000/svg";
function svgEl(t,a){ const el=document.createElementNS(NS,t); for(const k in a) el.setAttribute(k,a[k]); return el; }
function fmtA(a){ return a>=1000?(a/1000).toFixed(2)+" kA":Math.round(a)+" A"; }
function anchor(nodeId,tx){ const n=S.nodes[nodeId]; if(n.kind==="bus") return {x:Math.max(n.x,Math.min(tx,n.x2)),y:n.y}; return {x:n.x,y:n.y}; }
function ptToward(from,to,d){ const dx=from.x-to.x, dy=from.y-to.y, L=Math.hypot(dx,dy)||1; return {x:to.x+dx/L*d,y:to.y+dy/L*d}; }

    const x=e.x,y=e.y, live=E.edges.has(id), col=voltColor(e.kV,live);
    const g=svgEl("g",{class:"device"+(selected===id?" selected":""),"data-id":id});
    g.appendChild(svgEl("rect",{class:"hit",x:x-17,y:y-17,width:34,height:34,rx:6,fill:"transparent",stroke:"transparent"}));
    if(e.type==="breaker"){ const closed=e.state==="closed", tripped=e.tripped&&!closed;
      if(closed&&live) g.appendChild(svgEl("rect",{x:x-15,y:y-15,width:30,height:30,rx:5,fill:col,"fill-opacity":0.18}));
      g.appendChild(svgEl("rect",{x:x-12,y:y-12,width:24,height:24,rx:3,fill:closed?(live?col:COL.dead):"none",
        stroke:tripped?"#ff6b6b":(closed?(live?col:COL.dead):COL.deadLine),"stroke-width":tripped?2.8:2.4}));
      if(tripped){ const tt=svgEl("text",{x,y:y+3,fill:"#ff6b6b","font-size":10,"font-weight":700,"text-anchor":"middle"}); tt.textContent="⚡"; g.appendChild(tt); }
    } else { const closed=e.state==="closed", c=closed?(live?col:COL.dead):COL.deadLine;
      g.appendChild(svgEl("circle",{cx:x,cy:y+12,r:2.6,fill:c}));
      g.appendChild(svgEl("circle",{cx:x,cy:y-12,r:2.6,fill:"none",stroke:c,"stroke-width":2}));
      const bx=closed?x:x-13; g.appendChild(svgEl("line",{x1:x,y1:y+12,x2:bx,y2:y-12,stroke:c,"stroke-width":2.6,"stroke-linecap":"round"})); }
    const tie=S.nodes[e.a]&&S.nodes[e.b]&&S.nodes[e.a].kind==="bus"&&S.nodes[e.b].kind==="bus";
    const lt=svgEl("text",{x:x+(tie?0:19),y:tie?y-20:y+4,fill:"#c8cee0","font-size":10.5,"font-weight":600,
      "font-family":"Consolas,monospace","text-anchor":tie?"middle":"start"}); lt.textContent=e.label; L.txt.appendChild(lt);
    if(showMeas&&!tie&&e.type==="breaker"&&SOL.branchI[id]&&SOL.branchI[id].A>0.5){ const m=SOL.branchI[id];
      const it=svgEl("text",{x:x+19,y:y+16,fill:vcol(e.kV),"font-size":9.5,"font-weight":600,"font-family":"Consolas,monospace"});
      it.textContent=fmtA(m.A)+" · "+m.P.toFixed(1)+" MW"; L.txt.appendChild(it); }
    g.addEventListener("click",()=>select(id)); L.dev.appendChild(g);
  }

  /* alvos clicáveis de falta: barras, trafos, alimentadores */
  const ft=[];
  for(const [id,n] of Object.entries(S.nodes)) if(n.kind==="bus") ft.push({id,x:n.x,y:n.y-9,w:n.x2-n.x,h:18});
  for(const [id,e] of Object.entries(S.edges)) if(e.type==="transformer") ft.push({id,x:e.x-20,y:e.y-28,w:40,h:56});
  for(const ln of Object.keys(S.feeders)){ const f=S.feeders[ln]; ft.push({id:ln,x:f.x-15,y:f.y-26,w:30,h:32}); }
  for(const f of ft){ const g=svgEl("g",{class:"device"+(selected===f.id?" selected":""),"data-id":f.id});
    g.appendChild(svgEl("rect",{class:"hit",x:f.x,y:f.y,width:f.w,height:f.h,rx:5,fill:"transparent",stroke:"transparent"}));
    g.addEventListener("click",()=>select(f.id)); L.dev.appendChild(g); }

  /* marcador de falta */
  if(activeFault){ let fx,fy;
    if(activeFault.kind==="bus"){ const c=S.nodes[activeFault.at]; fx=(c.x+c.x2)/2; fy=c.y; }
    else if(activeFault.kind==="transformer"){ const e=S.edges[activeFault.at]; fx=e.x; fy=e.y; }
    else { const f=S.feeders[activeFault.at]; fx=f.x; fy=f.y-12; }
    L.txt.appendChild(svgEl("path",{d:`M${fx},${fy-15} l4,9 l9,-2 l-6,7 l6,7 l-9,-2 l-4,9 l-4,-9 l-9,2 l6,-7 l-6,-7 l9,2 Z`,fill:"#ff4d4d",stroke:"#fff","stroke-width":1})); }

  svg.appendChild(L.lines); svg.appendChild(L.sym); svg.appendChild(L.dev); svg.appendChild(L.txt);
}

function bindFault(id,kind){ const ts=document.getElementById("ftypeSel"); if(ts) ts.onchange=()=>{ faultType=ts.value; };
  const tt=document.getElementById("transTog"); if(tt) tt.onclick=()=>{ faultTransient=!faultTransient; renderPanel(); };

  const cr=document.getElementById("cmdRem"); if(cr) cr.onclick=()=>removeFault(); }
function showBlock(msg){ const b=document.getElementById("blkMsg"); if(b){ b.textContent="⛔ "+msg; b.classList.add("show"); } }

function operate(id,newState){
  const e=S.edges[id]; if(e.state===newState) return;
  const chk=canOperate(id,newState);
  if(!chk.ok){ log("block","BLOQUEIO: "+chk.reason); if(currentScenario&&!scenDone) scenViolations++; render(); renderPanel(); showBlock(chk.reason); updateScenBar(); return; }
  e.state=newState;
  if(newState==="closed"){ e.tripped=false; if(e.locked){ e.locked=false; log("auto",`${e.label}: religador rearmado (bloqueio 86 reposto).`); } }
  if(e.sync&&newState==="open") syncedG[id]=false;
  const verb=e.type==="ground"?(newState==="closed"?"ATERRAR":"DESATERRAR"):(newState==="closed"?"FECHAR":"ABRIR");
  log("cmd",`${verb} ${e.label}`);
  if(currentScenario&&!scenDone) scenManeuvers++;
  render(); renderPanel(); reportIslands();
  if(newState==="closed"&&activeFault){
    const fed=activeFault.kind==="transformer"?(computeEnergization().nodes.has(S.edges[activeFault.at].a)||computeEnergization().nodes.has(S.edges[activeFault.at].b)):computeEnergization().nodes.has(activeFault.at);
    if(fed){ log("alarm","RELIGAMENTO SOBRE FALTA — proteção reatua."); if(currentScenario&&!scenDone) scenCatastrophic=true; doFaultSequence(activeFault.at,activeFault.kind,activeFault.ftype,activeFault.transient); }
  }
  checkObjective();
}
/* 79 — religamento automático. Após a proteção isolar a falta, os disjuntores
   tripados que possuem p79 religam após o tempo morto. Falta transitória →
   sucesso e linha restabelecida; falta permanente → reatuação a cada tentativa
   e, esgotadas as tentativas, BLOQUEIO (lockout / 86). */
function runReclose(ids,at,kind,ftype,transient,tBase){
  const p79=S.prot[ids[0]].p79; const deads=Array.isArray(p79.dead)?p79.dead:[p79.dead];
  const labels=ids.map(i=>S.edges[i].label).join(", ");
  let t=tBase;
  for(let shot=1;shot<=deads.length;shot++){
    t+=deads[shot-1];
    ids.forEach(id=>{ S.edges[id].state="closed"; S.edges[id].tripped=false; });
    log("trip",`t=${(t*1000).toFixed(0)} ms · 79 RELIGAMENTO tentativa ${shot}/${deads.length} → fecha ${labels}`);
    if(transient){ clearFault();
      log("auto",`Religamento ${shot} BEM-SUCEDIDO — falta transitória extinta, ${labels} restabelecido(s).`);
      return; }
    const rr=resolveFault(at,kind,ftype);
    if(rr.ok&&rr.seq.length){ rr.seq.forEach(s=>log("trip",`t=${((s.t+t)*1000).toFixed(0)} ms · ${s.msg} [pós-religamento]`)); t+=rr.seq[rr.seq.length-1].t; }
    log("alarm",`Religamento ${shot} sobre falta PERMANENTE — proteção reatua.`);
  }
  ids.forEach(id=>{ S.edges[id].state="open"; S.edges[id].tripped=true; S.edges[id].locked=true; });
  log("alarm",`79 BLOQUEIO (lockout · 86) — ${labels} inibido(s). Repare a falta e rearme (fechamento manual).`);
}
function doFaultSequence(at,kind,ftype,transient){
  ftype=ftype||"3ph";
  const r=resolveFault(at,kind,ftype); if(activeFault) activeFault.transient=!!transient;
  if(!r.ok){ log("alarm","FALTA: "+r.reason); render(); renderPanel(); return; }
  const gnd=(ftype==="1ph"||ftype==="2phg");
  log("alarm",`FALTA ${FTYPES[ftype]}${transient?" (transitória)":""} em ${labelOf(at)} @ ${r.kVf} kV — Ifase = ${(r.If/1000).toFixed(2)} kA${gnd?` · 3I0 = ${(r.I3I0/1000).toFixed(2)} kA`:""}`);
  if(r.note) log("auto",r.note);
  r.seq.forEach(s=>log("trip",`t=${(s.t*1000).toFixed(0)} ms · ${s.msg}`));
  if(r.seq.length){
    if(r.cleared){
      const reclosers=Object.keys(S.edges).filter(id=>S.edges[id].tripped&&S.edges[id].state==="open"&&S.prot[id]&&S.prot[id].p79);
      const tBase=r.seq[r.seq.length-1].t;
      if(reclosers.length) runReclose(reclosers,at,kind,ftype,transient,tBase);
      else log("auto","Falta isolada pela proteção.");
    } else log("alarm","⚠ FALTA NÃO ELIMINADA — verifique ajustes/recusas.");
  }
  render(); renderPanel(); reportIslands();
}
function applyFault(at,kind){ if(activeFault) return; doFaultSequence(at,kind,faultType,faultTransient); }
function removeFault(){ if(!activeFault) return; log("auto",`Falta removida em ${labelOf(activeFault.at)} (reparo concluído).`); clearFault(); render(); renderPanel(); }

/* =========================================================================
   CENÁRIOS · AVALIADOR · PERSISTÊNCIA
   ========================================================================= */
const energ=()=>computeEnergization().nodes;
function resetNormal(){ Object.keys(NORMAL).forEach(id=>{ if(S.edges[id]) S.edges[id].state=NORMAL[id]; });
  Object.values(S.edges).forEach(e=>{ e.tripped=false; e.failed=false; e.locked=false; }); clearFault(); syncedG={}; }
let currentScenario=null, scenManeuvers=0, scenViolations=0, scenCatastrophic=false, scenDone=false, scenScore=null;
function scoreKey(){ return "sim_scores_"+activeSub; }
function loadScores(){ try{ return JSON.parse(localStorage.getItem(scoreKey())||"{}"); }catch(_){ return {}; } }
function saveScore(id,score){ try{ const s=loadScores(); if(!(id in s)||score>s[id]){ s[id]=score; localStorage.setItem(scoreKey(),JSON.stringify(s)); } }catch(_){} }
function loadScenario(id){ currentScenario=id; scenManeuvers=0; scenViolations=0; scenCatastrophic=false; scenDone=false; scenScore=null;
  selected=null;
  if(id==="free") resetNormal(); else SCEN()[id].setup();
  log("auto",`Cenário: ${id==="free"?"Modo livre":SCEN()[id].title}.`);
  render(); renderPanel(); reportIslands(); updateScenBar(); }
function SCEN(){ return S.scenarios; }
function checkObjective(){ if(!currentScenario||currentScenario==="free"||scenDone) return; const sc=SCEN()[currentScenario]; if(sc.objective&&sc.objective()) finishScenario(); }
function finishScenario(){ const sc=SCEN()[currentScenario]; let score;
  if(scenCatastrophic) score=0; else { const eff=scenManeuvers<=sc.optimal?10:Math.max(0,10-(scenManeuvers-sc.optimal)*3); score=Math.max(0,100-scenViolations*15+eff); }
  scenDone=true; scenScore=score; saveScore(currentScenario,score);
  log("auto",`✓ CENÁRIO CONCLUÍDO — ${score}/110 · manobras ${scenManeuvers}/${sc.optimal} · violações ${scenViolations}${scenCatastrophic?" · FALHA GRAVE":""}.`);
  updateScenBar(); }
function updateScenBar(){ const host=document.getElementById("scenInfo"); if(!host) return;
  if(currentScenario==="free"){ host.innerHTML=`<div class="scen-desc">Opere a subestação livremente: manobre, aterre, injete faltas e observe a proteção. Sem avaliação.</div>`; return; }
  const sc=SCEN()[currentScenario], best=loadScores()[currentScenario];
  const statusBadge=scenDone?`<span class="badge ok">OBJETIVO ATINGIDO</span>`:`<span class="badge pend">EM ANDAMENTO</span>`;
  const scoreHtml=scenDone?`<div class="scen-score" style="${scenScore<60?'color:var(--danger)':scenScore<85?'color:var(--gold)':''}">${scenScore}<span style="font-size:13px;color:var(--ink-dim)">/110</span></div>`:"";
  host.innerHTML=`<div class="scen-desc">${sc.desc}</div>
    <div class="scen-stat">${statusBadge}<span class="badge">Manobras ${scenManeuvers}/${sc.optimal}</span>
    <span class="badge ${scenViolations?'warn':''}">Violações ${scenViolations}</span>${best!==undefined?`<span class="badge ok">Melhor ${best}</span>`:""}</div>
    ${scoreHtml}
    <div class="scen-btns"><button id="scenRestart">Reiniciar</button><button id="scenHint">Dica</button></div>
    <div class="scen-hint" id="hintBox">${sc.hint}</div>`;
  const rb=document.getElementById("scenRestart"); if(rb) rb.onclick=()=>loadScenario(currentScenario);
  const hb=document.getElementById("scenHint"); if(hb) hb.onclick=()=>document.getElementById("hintBox").classList.toggle("show");
}
function populateScenSel(){ const sel=document.getElementById("scenSel"); const scores=loadScores();
  let opts=`<option value="free">Modo livre — operação aberta</option>`;
  opts+=Object.entries(SCEN()).map(([id,sc])=>`<option value="${id}">${sc.title}${scores[id]!==undefined?"  ✓"+scores[id]:""}</option>`).join("");
  sel.innerHTML=opts; sel.value="free"; sel.onchange=()=>loadScenario(sel.value);
}

/* =========================================================================
   SELETOR DE SUBESTAÇÃO + INIT
   ========================================================================= */
let activeSub=null;
function loadSub(id){
  activeSub=id; S=SUBSTATIONS[id];
  NORMAL={}; Object.keys(S.edges).forEach(eid=>{ if(S.edges[eid].state) NORMAL[eid]=S.edges[eid].state; });
  syncedG={}; selected=null; lastLive=-1;
  document.getElementById("subTitle").textContent=S.subtitle;
  renderLegend(); populateScenSel();
  loadScenario("free");
}
(function initSub(){ const sel=document.getElementById("subSel");
  sel.innerHTML=Object.entries(SUBSTATIONS).map(([id,s])=>`<option value="${id}">${s.name}</option>`).join("");
  sel.onchange=()=>loadSub(sel.value);
  loadSub("A");
})();
</script>
